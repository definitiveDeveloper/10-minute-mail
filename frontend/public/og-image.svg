<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Accent glow circle -->
  <circle cx="900" cy="120" r="280" fill="#6366f1" opacity="0.08"/>
  <circle cx="200" cy="520" r="200" fill="#8b5cf6" opacity="0.06"/>

  <!-- Email icon -->
  <rect x="80" y="85" width="80" height="60" rx="8" fill="url(#accent)" opacity="0.9"/>
  <path d="M80 95 L120 120 L160 95" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>

  <!-- Badge -->
  <rect x="80" y="175" width="200" height="34" rx="17" fill="url(#pill)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="180" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle" font-weight="600">FREE &amp; ANONYMOUS</text>

  <!-- Main headline -->
  <text x="80" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white">10 Minute</text>
  <text x="80" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#accent)">Mail</text>

  <!-- Subheading -->
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8" font-weight="400">Instant disposable email. No sign-up. No spam.</text>

  <!-- Divider -->
  <rect x="80" y="455" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Stats row -->
  <text x="80" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6366f1" font-weight="700">10:00</text>
  <text x="80" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">auto-expiry</text>

  <text x="240" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6366f1" font-weight="700">0 sec</text>
  <text x="240" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">to get started</text>

  <text x="400" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6366f1" font-weight="700">41 lang</text>
  <text x="400" y="535" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">supported</text>

  <!-- Domain watermark -->
  <text x="1120" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#334155" text-anchor="end">10-minute-mail.online</text>

  <!-- Right side decorative inbox mockup -->
  <rect x="760" y="200" width="360" height="260" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="760" y="200" width="360" height="44" rx="16" fill="#0f172a"/>
  <rect x="760" y="228" width="360" height="16" fill="#0f172a"/>
  <text x="940" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">Inbox</text>
  <!-- Inbox rows -->
  <rect x="780" y="264" width="320" height="48" rx="8" fill="#0f172a"/>
  <circle cx="804" cy="288" r="12" fill="#6366f1" opacity="0.7"/>
  <rect x="824" y="278" width="160" height="8" rx="4" fill="#475569"/>
  <rect x="824" y="294" width="220" height="6" rx="3" fill="#334155"/>

  <rect x="780" y="322" width="320" height="48" rx="8" fill="#0f172a"/>
  <circle cx="804" cy="346" r="12" fill="#8b5cf6" opacity="0.7"/>
  <rect x="824" y="336" width="140" height="8" rx="4" fill="#475569"/>
  <rect x="824" y="352" width="200" height="6" rx="3" fill="#334155"/>

  <rect x="780" y="380" width="320" height="48" rx="8" fill="#0f172a"/>
  <circle cx="804" cy="404" r="12" fill="#6366f1" opacity="0.4"/>
  <rect x="824" y="394" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="824" y="410" width="240" height="6" rx="3" fill="#1e293b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Purple rounded-square background -->
  <rect width="32" height="32" rx="7" fill="#6f5af6"/>
  <!-- Crown bar (matches Logo line x1=10 x2=14 y1=2 y2=2, scaled to 32x32) -->
  <line x1="13" y1="5" x2="19" y2="5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Clock body circle (matches Logo circle cx=12 cy=14 r=8, scaled) -->
  <circle cx="16" cy="19.5" r="10" stroke="white" stroke-width="2.5"/>
  <!-- Clock hand (matches Logo line x1=12 x2=15 y1=14 y2=11, scaled) -->
  <line x1="16" y1="19.5" x2="21" y2="15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
